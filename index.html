<style>
  :root{
    --bg:#FBFAF8; --bg-elev:#FFFFFF; --bg-elev2:#F1EBFC;
    --line:#E6E2DA; --text:#242220; --text-dim:#837E76;
    --accent:#8B5CF6; --accent2:#6D4FE0; --accent-soft:#F0EAFB;
    --up:#C5382E; --up-soft:#F7E2DF;
    --down:#1F7A54; --down-soft:#DCEEE4;
    --buy:#C5382E; --buy-soft:#F7E2DF;
    --sell:#2F6FCF; --sell-soft:#E2ECFB;
    --radius:14px;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FBFAF8; --bg-elev:#FFFFFF; --bg-elev2:#F1EBFC;
      --line:#E6E2DA; --text:#242220; --text-dim:#837E76;
      --accent:#8B5CF6; --accent2:#6D4FE0; --accent-soft:#F0EAFB;
      --up:#C5382E; --up-soft:#F7E2DF;
      --down:#1F7A54; --down-soft:#DCEEE4;
      --buy:#C5382E; --buy-soft:#F7E2DF;
      --sell:#2F6FCF; --sell-soft:#E2ECFB;
    }
  }
  :root[data-theme="light"]{
    --bg:#FBFAF8; --bg-elev:#FFFFFF; --bg-elev2:#F1EBFC;
    --line:#E6E2DA; --text:#242220; --text-dim:#837E76;
    --accent:#8B5CF6; --accent2:#6D4FE0; --accent-soft:#F0EAFB;
    --up:#C5382E; --up-soft:#F7E2DF;
    --down:#1F7A54; --down-soft:#DCEEE4;
    --buy:#C5382E; --buy-soft:#F7E2DF;
    --sell:#2F6FCF; --sell-soft:#E2ECFB;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .wrap{ max-width:520px; margin:0 auto; padding:0 16px 112px; }
  header.top{
    position:sticky; top:0; z-index:20;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-bottom:14px; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  header.top .row{ display:flex; align-items:center; justify-content:space-between; max-width:520px; margin:0 auto; padding:0 16px;}
  header.top h1{ font-size:17px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  header.top .sub{ font-size:12px; color:var(--text-dim); margin-top:2px;}
  .iconbtn{ background:none; border:1px solid var(--line); color:var(--text-dim); width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
  .iconbtn:active{ transform:scale(0.95); }

  .card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:12px; }
  .card h2{ font-size:13px; font-weight:600; color:var(--text-dim); margin:0 0 10px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--bg-elev2); border-radius:10px; padding:10px 12px; }
  .stat .l{ font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .stat .v{ font-size:17px; font-weight:600; }
  .stat .v.mono{ font-size:16px; }
  .up{ color:var(--up); } .down{ color:var(--down); }
  .pnl-pos{ color:var(--up); } .pnl-neg{ color:var(--sell); }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--bg-elev2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:10px; font-size:16px; font-family:inherit;
  }
  .datebtn{ position:relative; overflow:hidden; width:100%; background:var(--bg-elev2); border:1px solid var(--line); color:var(--text); padding:11px 12px; border-radius:10px; font-size:16px; }
  .datebtn input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; padding:0; margin:0; }
  .settlebox{ background:var(--bg-elev2); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
  .settlebox .l{ font-size:12.5px; color:var(--text-dim); }
  .settlebox .v{ font-weight:600; }
  .seg{ display:flex; gap:6px; background:var(--bg-elev2); padding:4px; border-radius:10px; }
  .seg button{ flex:1; padding:9px 4px; border:none; background:none; color:var(--text-dim); border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .seg button.active{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn{ width:100%; padding:13px; border-radius:11px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn.ghost{ background:var(--bg-elev2); color:var(--text); border:1px solid var(--line); }
  .btn.buy{ background:var(--buy-soft); color:var(--buy); }
  .btn.sell{ background:var(--sell-soft); color:var(--sell); }
  .btn:active{ transform:scale(0.98); }
  .btnrow{ display:flex; gap:8px; margin-top:12px; }
  .btnrow .btn{ flex:1; }

  .tabbar{
    position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:30;
    background:var(--bg-elev); border:1px solid var(--line); border-radius:16px;
    max-width:496px; margin:0 auto;
    box-shadow:0 8px 28px rgba(0,0,0,0.28);
  }
  /* 키보드가 열려 있는 동안(입력칸 포커스 중)에는 플로팅 탭바 숨김 → 기록 추가 버튼 오터치 방지 */
  body.kb-open .tabbar{ display:none !important; }
  .tabbar .row{ max-width:520px; margin:0 auto; display:flex; }
  .tabbar button{ flex:1; background:none; border:none; padding:10px 0 9px; color:var(--text-dim); font-family:inherit; cursor:pointer;}
  .tabbar button .ic{ font-size:18px; display:block; }
  .tabbar button .tx{ font-size:10.5px; margin-top:2px; }
  .tabbar button.active{ color:var(--accent); }

  .order-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .order-row:last-child{ border-bottom:none; }
  .tag{ font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .tag.loc{ background:var(--accent-soft); color:var(--accent); }
  .tag.limit{ background:var(--down-soft); color:var(--down); }
  .tag.moc{ background:var(--up-soft); color:var(--up); }
  .tag.buy{ background:var(--buy-soft); color:var(--buy); }
  .tag.sell{ background:var(--sell-soft); color:var(--sell); }

  .trade-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .trade-item:last-child{ border-bottom:none; }
  .trade-item .meta{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .del{ background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; padding:6px; }

  .empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:30px 10px; }
  .banner{ background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-top:12px; line-height:1.5;}
  .checkline{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); margin-top:10px;}
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .modal-bg.open{ display:flex; }
  .modal{ background:var(--bg-elev); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-size:16px; }
  .divider{ height:1px; background:var(--line); margin:14px 0; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; }
  ::selection{ background:var(--accent-soft); }
</style>

<script>
/* ============================= GLOBAL ERROR SURFACE =============================
   Catches anything, anywhere, and shows it in a plain DOM banner that does not
   depend on any other app code (so it still works even if something else is broken).
=================================================================================== */
function showBootError(msg){
  let el = document.getElementById('bootErrorBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'bootErrorBanner';
    el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:74px;z-index:99999;background:#D64545;color:#fff;padding:10px 12px;border-radius:10px;font-size:11.5px;font-family:monospace;max-height:34vh;overflow:auto;white-space:pre-wrap;box-shadow:0 4px 20px rgba(0,0,0,.4);';
    document.body.appendChild(el);
  }
  el.textContent = String(msg);
}
window.addEventListener('error', function(ev){
  // 외부 스크립트(fonts 등) 오류는 무시 (Script error / cross-origin)
  if(!ev || !ev.message || ev.message === 'Script error.' || ev.message === 'Script error') return;
  // 외부 파일에서 발생한 오류는 무시
  if(ev.filename && !ev.filename.includes(location.hostname)) return;
  showBootError('오류: ' + ev.message + (ev.filename ? ' ('+ev.filename+':'+ev.lineno+')' : ''));
});
window.addEventListener('unhandledrejection', function(ev){
  if(!ev || !ev.reason) return;
  const msg = ev.reason && (ev.reason.message || String(ev.reason));
  // 폰트/외부 리소스 오류 무시
  if(!msg || msg.includes('font') || msg.includes('Failed to fetch') && !msg.includes('quote')) return;
  showBootError('비동기 오류: ' + msg);
});
</script>
<script>
/* ============================= STORAGE ============================= */
const STORE_KEY = 'infbuy_tracker_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('load fail', e); }
  return { setup:null, trades:[], reverseRef:{closes:[], lastClose:null} };
}
function saveLocal(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ console.warn('local save fail', e); }
}
function saveState(){
  userActed = true;
  saveLocal();
  if(cloudDoc){
    cloudDoc.set(JSON.parse(JSON.stringify(S))).catch(e=>console.warn('cloud save fail', e));
  }
}
let S = loadState();
let cloudDoc = null;
let userActed = false; // true from the user's very first tap in this session
document.addEventListener('pointerdown', function(){ userActed = true; }, {capture:true});
document.addEventListener('touchstart', function(){ userActed = true; }, {capture:true, passive:true});
let currentTab = (function(){
  try{
    const saved = sessionStorage.getItem('infbuy_tab_after_reload');
    if(saved){ sessionStorage.removeItem('infbuy_tab_after_reload'); return saved; }
  }catch(e){}
  return 'plan';
})();
let addKind = 'buy'; // 기록추가 탭에서 매수/매도 선택 상태
// 기록추가 입력 중인 값(임시 저장). 매수↔매도 전환이나 다른 탭 이동 시에도 유지됨
let addDraft = { date:'', price:'', qty:'', fee:'0', dropFlag:false, sellKind:'quarter' };
function captureAddDraft(){
  // 지금 화면에 떠 있는 입력칸(매수 또는 매도)의 값을 읽어서 저장
  const k = addKind; // 'buy' 또는 'sell'
  const g = id => document.getElementById(id);
  if(!g(k+'Price')) return; // 기록추가 화면이 아니면 아무것도 안 함
  addDraft.date  = g(k+'Date') ? g(k+'Date').value : addDraft.date;
  addDraft.price = g(k+'Price').value;
  addDraft.qty   = g(k+'Qty').value;
  addDraft.fee   = g(k+'Fee').value;
  if(g('buyFlagDrop')) addDraft.dropFlag = g('buyFlagDrop').checked;
  const sk = document.querySelector('#segSellKind .active');
  if(sk) addDraft.sellKind = sk.dataset.v;
}
function resetAddDraft(){ addDraft = { date:'', price:'', qty:'', fee:'0', dropFlag:false, sellKind:'quarter' }; }
function setAddKind(k){ captureAddDraft(); addKind = k; render(); }

async function initCloud(){
  // Vercel 환경에서는 localStorage만 사용 (claude 객체 없음)
  cloudDoc = null;
}

/* ============================= HELPERS ============================= */
function fmt(n, d=2){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtInt(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Math.round(n).toLocaleString('en-US'); }
function uid(){ return 't'+Math.random().toString(36).slice(2,9); }
function ceil2(x){ return Math.ceil(x*100)/100; }

/* ============================= ENGINE =============================
   3 modes: v22 (V2.2), v4 (V4.0), v3 (V3.0)
   모든 모드가 이동평균법(국내 증권사 평단가 계산 방식)으로 보유수량/평단/실현손익을 계산.
====================================================================== */
function computeEngine(){
  if(!S.setup) return null;
  const st = S.setup;
  const a = st.divisions;
  const B = st.stock === 'SOXL' ? 20 : 15;
  const base1Round = st.principal / a; // fixed, never changes
  const limitPct = st.limitPct;
  const trades = S.trades.slice().sort((x,y)=>x.ts-y.ts);

  // ---- moving-average (이동평균법) accounting for holdings/평단/실현손익 ----
  // 국내 증권사 평단가는 보유수량이 남아있는 한 매도로는 평단이 변하지 않고, 매수 시에만
  // (기존 평단×기존수량 + 신규매수금액) ÷ (기존수량+신규수량) 으로 재계산되는 이동평균법을 씀.
  // 기존 FIFO(선입선출) 방식은 매도 때마다 가장 오래된(저가) 수량부터 소진시켜 평단이
  // 실제보다 낮게 재계산되는 차이가 있어, 증권사 표시값과 맞도록 이동평균법으로 변경.
  let holdQty = 0;
  let avgCost = 0;
  let realizedPnL = 0;
  let totalBuyAmt = 0, totalSellAmt = 0;
  let cycleBuyAmt = 0; // resets when holdings hit 0 (new cycle)
  let profitPool = 0;      // unused compounding profit (V3)
  let maxRoundAmount = base1Round; // V3 high-water 1회매수금
  let currentRoundAmount = base1Round; // variable 1회매수금 used for V2.2/V4 order sizing & fraction calc
  let T = 0;
  let cycleCount = 0;
  let mode2_2Note = '';
  let tradePnl = {}; // per-sell realized P&L, keyed by trade id

  function remainingCash(){
    // cash still available toward this cycle's target = principal - net invested (buy-sell) - ... simplistic per-cycle
    const netInvested = cycleBuyAmt - (totalSellAmt - sellAmtAtCycleStart);
    return Math.max(st.principal - netInvested, 0);
  }
  let sellAmtAtCycleStart = 0;
  let cycles = [];
  let cur = { startTs:null, buyAmt:0, sellAmt:0, fee:0, buyCount:0, sellCount:0, pnl:0 };

  for(const tr of trades){
    if(tr.type==='buy'){
      const fee = tr.fee||0;
      const amt = tr.price*tr.qty + fee;
      const newQty = holdQty + tr.qty;
      avgCost = newQty>0 ? (avgCost*holdQty + amt) / newQty : 0;
      holdQty = newQty;
      totalBuyAmt += amt;
      cycleBuyAmt += amt;
      if(cur.startTs===null) cur.startTs = tr.ts;
      cur.buyAmt += amt; cur.fee += fee; cur.buyCount++;

      if(st.mode==='v4'){
        const denom = Math.max(a - T, 0.0001);
        currentRoundAmount = remainingCash()>0 ? remainingCash()/denom : base1Round;
        let frac = currentRoundAmount>0 ? Math.min(amt/currentRoundAmount, 1.2) : 1;
        if(tr.flags && tr.flags.postSellDrop){ T = T*0.25 + frac; }
        else { T = T + frac; }
      } else if(st.mode==='v22'){
        // T derived from net invested amount vs fixed base (recomputed after loop for simplicity)
      } else if(st.mode==='v3'){
        currentRoundAmount = maxRoundAmount; // order sizing uses compounding amount
        T = ceil2(cycleBuyAmt / base1Round);
      }
    } else { // sell
      const sellFee = tr.fee||0;
      const proceeds = tr.price*tr.qty - sellFee;
      const costOfSold = avgCost * tr.qty; // 이동평균법: 매도해도 평단(avgCost)은 그대로 유지
      const pnl = proceeds - costOfSold;
      realizedPnL += pnl;
      tradePnl[tr.id] = pnl;
      totalSellAmt += proceeds;
      if(cur.startTs===null) cur.startTs = tr.ts;
      cur.sellAmt += proceeds; cur.fee += sellFee; cur.sellCount++; cur.pnl += pnl;
      holdQty = Math.max(holdQty - tr.qty, 0);

      if(st.mode==='v4'){
        if(tr.flags && tr.flags.quarterSell){ T = T*0.75; }
      } else if(st.mode==='v3'){
        if(pnl>0) profitPool += pnl/40;
        maxRoundAmount = Math.max(maxRoundAmount, base1Round + profitPool);
        currentRoundAmount = maxRoundAmount;
      }

      if(holdQty<=0.00001){
        // cycle end — record settlement
        holdQty = 0; avgCost = 0;
        cycleCount++;
        cycles.push({
          stock:st.stock, mode:st.mode, seed:st.principal, divisions:a, base1Round,
          startTs:cur.startTs, endTs:tr.ts,
          buyAmt:cur.buyAmt, sellAmt:cur.sellAmt, fee:cur.fee,
          buyCount:cur.buyCount, sellCount:cur.sellCount, pnl:cur.pnl
        });
        cur = { startTs:null, buyAmt:0, sellAmt:0, fee:0, buyCount:0, sellCount:0, pnl:0 };
        cycleBuyAmt = 0; sellAmtAtCycleStart = totalSellAmt; T=0;
        if(st.mode==='v3'){
          if(realizedPnL>0) profitPool += realizedPnL/40; // apply remaining cycle-end profit too (best-effort)
          maxRoundAmount = Math.max(maxRoundAmount, base1Round + profitPool);
        }
      }
    }
  }

  const holdingQty = holdQty;
  const avgPrice = avgCost;

  // 시드소진율: 매도로 회수된 금액(현재 사이클분)은 누적매수액에서 차감한 순매수액 기준
  const netInvested = Math.max(cycleBuyAmt - (totalSellAmt - sellAmtAtCycleStart), 0);

  // 진행회차(T)는 시드소진율(순매수÷원금)과 항상 정비례해야 함: 소진율이 100%를 넘지 않는 구간에서는
  // 모드에 관계없이 순매수액 기준으로 T를 다시 계산 (기존의 분할누적 방식 대신 사용)
  if(st.principal>0 && netInvested <= st.principal){
    T = base1Round>0 ? netInvested/base1Round : 0;
    const denom = Math.max(a - T, 0.0001);
    currentRoundAmount = remainingCash()>0 ? remainingCash()/denom : base1Round;
  } else if(st.mode==='v22'){
    const denom = Math.max(a - T, 0.0001);
    currentRoundAmount = remainingCash()>0 ? remainingCash()/denom : base1Round;
  }
  if(st.mode==='v3' && holdingQty>0){
    // recompute current round amount from live profitPool (already tracked)
    currentRoundAmount = maxRoundAmount;
  }

  // ---- phase & percent ----
  let pct, phase, quarterMode=false, reverseMode=false;
  if(st.mode==='v22'){
    pct = 10 - (T/2)*(40/a);
    phase = T < a/2 ? 'front' : (T <= a-1 ? 'back' : 'quarterloss');
    quarterMode = phase==='quarterloss';
  } else if(st.mode==='v4' || st.mode==='v3'){
    pct = B*(1 - 2*T/a);
    phase = T < a/2 ? 'front' : 'back';
    if(T > a-1) { quarterMode = true; phase='quarterloss'; }
    if(st.mode==='v4' && S.reverseModeOn) { reverseMode = true; }
  }

  const buyLegPrice = holdingQty>0 ? avgPrice*(1+pct/100) - 0.01 : null;
  const evenPrice = holdingQty>0 ? avgPrice - 0.01 : null; // 0% leg
  const sellLegPrice = holdingQty>0 ? avgPrice*(1+pct/100) : null;
  const limitSellPrice = holdingQty>0 ? avgPrice*(1+limitPct/100) : null;

  return {
    a, B, base1Round, limitPct, holdingQty, avgPrice, realizedPnL, totalBuyAmt, totalSellAmt,
    T, phase, quarterMode, reverseMode, pct, currentRoundAmount, netInvested, tradePnl,
    buyLegPrice, evenPrice, sellLegPrice, limitSellPrice, cycleCount, cycles
  };
}

/* ============================= REVERSE MODE (V4) helpers ============================= */
function reverseAvgClose(){
  const arr = (S.reverseRef.closes||[]).filter(x=>!isNaN(x));
  if(arr.length===0) return null;
  const last5 = arr.slice(-5);
  return last5.reduce((a,b)=>a+b,0)/last5.length;
}

let undoSnapshot = null;
let undoTimer = null;
function showToast(msg, onUndo){
  let el = document.getElementById('toastBar');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastBar';
    el.style.cssText = 'position:fixed; left:12px; right:12px; z-index:9000; bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--bg-elev2); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px; box-shadow:0 6px 24px rgba(0,0,0,.35);';
    document.body.appendChild(el);
  }
  clearTimeout(undoTimer);
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if(onUndo){
    const btn = document.createElement('button');
    btn.textContent = '되돌리기';
    btn.style.cssText = 'background:none;border:none;color:var(--accent);font-weight:700;font-size:13.5px;font-family:inherit;flex-shrink:0;';
    btn.onclick = function(){
      onUndo();
      el.remove();
      clearTimeout(undoTimer);
    };
    el.appendChild(btn);
  }
  el.style.display = 'flex';
  undoTimer = setTimeout(()=>{ el.remove(); }, 6000);
}
function handleResetClick(){

  location.reload();

function checkUndoSnapshotAfterReload(){
  try{
    const resetRaw = sessionStorage.getItem('infbuy_undo_reset');
    if(resetRaw){
      sessionStorage.removeItem('infbuy_undo_reset');
      const snap = JSON.parse(resetRaw);
      showToast('종목 설정과 매매기록을 모두 삭제했습니다.', ()=>{
        S = snap; saveState(); render();
      });
      return;
    }
    const msg = sessionStorage.getItem('infbuy_toast_after_reload');
    if(msg){
      sessionStorage.removeItem('infbuy_toast_after_reload');
      const undoRaw = sessionStorage.getItem('infbuy_undo_trade');
      if(undoRaw){
        sessionStorage.removeItem('infbuy_undo_trade');
        const removedTrade = JSON.parse(undoRaw);
        showToast(msg, ()=>{
          S.trades = [...S.trades, removedTrade];
          saveState(); render();
        });
      } else {
        showToast(msg);
      }
    }
  }catch(e){ console.warn('post-reload toast restore fail', e); }
}

}
function toggleReverse(v){ S.reverseModeOn = v; saveState(); render(); }

/* ---------- Plan ---------- */
function planView(e){
  if(!e) return '';
  if(e.holdingQty<=0){
    return `<div class="card"><h2>매매계획</h2><div class="empty">첫 매수를 기록하면<br>매수 계획이 표시됩니다.</div></div>
    <button class="btn primary" style="margin-top:12px" onclick="setTab('add')">첫 매수 기록하기</button>`;
  }

  if(S.setup.mode==='v4' && S.reverseModeOn){
    return reversePlanView(e);
  }

  let buyRows = '';
  if(!e.quarterMode){
    if(e.phase==='front'){
      const half = e.currentRoundAmount/2;
      const qtyStar = e.buyLegPrice>0 ? Math.floor(half/e.buyLegPrice) : 0;
      const qtyEven = e.evenPrice>0 ? Math.floor(half/e.evenPrice) : 0;
      buyRows = `
        <div class="order-row"><span><span class="tag loc">LOC</span> 별지점 ${fmt(e.pct)}%</span><span class="mono" style="color:var(--buy); font-weight:600;">$${fmt(e.buyLegPrice)} · ${fmtInt(qtyStar)}주</span></div>
        <div class="order-row"><span><span class="tag loc">LOC</span> 평단(0%)</span><span class="mono" style="color:var(--buy); font-weight:600;">$${fmt(e.evenPrice)} · ${fmtInt(qtyEven)}주</span></div>
      `;
    } else {
      const qtyFull = e.buyLegPrice>0 ? Math.floor(e.currentRoundAmount/e.buyLegPrice) : 0;
      buyRows = `<div class="order-row"><span><span class="tag loc">LOC</span> 별지점 ${fmt(e.pct)}%</span><span class="mono" style="color:var(--buy); font-weight:600;">$${fmt(e.buyLegPrice)} · ${fmtInt(qtyFull)}주</span></div>`;
    }
  } else if(S.setup.mode==='v22'){
    const qsPrice = e.avgPrice*0.9;
    const qtyQs = qsPrice>0 ? Math.floor(e.currentRoundAmount/qsPrice) : 0;
    buyRows = `<div class="order-row"><span><span class="tag loc">LOC</span> 손절모드 (평단 −10%)</span><span class="mono" style="color:var(--buy); font-weight:600;">$${fmt(qsPrice)} · ${fmtInt(qtyQs)}주</span></div>`;
  } else {
    buyRows = `<div class="empty" style="padding:14px 0">쿼터매도 하는 날은 매수하지 않습니다.</div>`;
  }

  const quarterQty = Math.round(e.holdingQty/4);
  const limitQty = Math.floor(e.holdingQty*3/4);
  const quarterSellPrice = e.quarterMode ? '시장가(MOC)' : `$${fmt(e.sellLegPrice)} <span class="tag loc" style="margin-left:6px">LOC</span>`;

  return `
  <div class="card">
    <h2>다음 매수 계획 ${e.quarterMode && S.setup.mode!=='v22' ? '— 쿼터모드' : ''}</h2>
    ${buyRows}
    <div class="banner">1회 매수 시도액 ≈ $${fmtInt(e.currentRoundAmount)} (전반전은 절반씩, 후반전은 전액을 위 가격에 시도 · 수량은 초과하지 않도록 내림)</div>
  </div>
  <div class="card">
    <h2>다음 매도 계획 (쿼터매도)</h2>
    <div class="order-row"><span><span class="tag ${e.quarterMode?'moc':'loc'}">${e.quarterMode?'MOC':'LOC'}</span> 보유수량의 1/4</span><span class="mono" style="color:var(--sell); font-weight:600;">${e.quarterMode?'무조건매도':'$'+fmt(e.sellLegPrice)} · ${fmtInt(quarterQty)}주</span></div>
    <div class="order-row"><span><span class="tag limit">지정가</span> 보유수량의 3/4 (+${e.limitPct}%)</span><span class="mono" style="color:var(--sell); font-weight:600;">$${fmt(e.limitSellPrice)} · ${fmtInt(limitQty)}주</span></div>
    <div class="banner">쿼터매도 수량: ${fmtInt(quarterQty)}주 (반올림) · 지정가매도 수량: ${fmtInt(limitQty)}주 (내림)</div>
  </div>`;
}
function reversePlanView(e){
  const avg5 = reverseAvgClose();
  const half = Math.floor(e.holdingQty / Math.floor(e.a/2)) ;
  return `
  <div class="card">
    <h2>리버스모드 — 최근 5거래일 종가</h2>

  </div>
  <div class="card">
    <h2>리버스 매도 계획</h2>

  </div>
  <div class="card">
    <h2>리버스모드 종료 확인</h2>
    <div class="field"><label>현재 종가</label><input type="number" id="inpCurClose" placeholder="현재가 입력"></div>
    <button class="btn ghost" onclick="checkReverseExit(${e.avgPrice}, ${e.B})">종료 조건 확인</button>

function saveCloses(){
  const raw = document.getElementById('inpCloses').value;
  const arr = raw.split(',').map(s=>Number(s.trim())).filter(n=>!isNaN(n));
  S.reverseRef.closes = arr.slice(-5);
  saveState(); render();
}
function checkReverseExit(avgPrice, B){
  const cur = Number(document.getElementById('inpCurClose').value);
  const box = document.getElementById('reverseExitResult');
  if(!cur){ box.innerHTML=''; return; }
  const diffPct = (cur/avgPrice - 1)*100;
  const ok = diffPct > -B;
  box.innerHTML = `<div class="banner" style="margin-top:12px; ${ok?'':'opacity:0.85'}">현재가는 평단 대비 ${fmt(diffPct)}% (${ok? '기준 −'+B+'% 회복 → 일반모드로 복귀 가능' : '기준 −'+B+'%를 아직 회복하지 못함 → 리버스모드 유지'} )</div>`;
}

/* ---------- Add trade ---------- */

  return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;

function dateSelectHtml(prefix, isoDate){

  </div>`;
}
function getDateSelectValue(prefix){

}

    <div class="field"><label>매수 수수료</label><input type="number" id="buyFee" placeholder="$0" inputmode="decimal" value="${dF}" oninput="updateBuyPreview()"></div>
    <div class="settlebox"><span class="l">매수 정산금액</span><span class="v mono" id="buySettle">$0.00</span></div>
    ${S.setup.mode==='v4' ? `<div class="checkline"><input type="checkbox" id="buyFlagDrop" ${addDraft.dropFlag?'checked':''}><label for="buyFlagDrop">지정가매도 직후 하락해서 발생한 매수</label></div>` : ''}
    <button class="btn buy" style="margin-top:12px" onclick="submitBuy()">매수 기록 추가</button>
  </div>`;
  const sellCard = `
  <div class="card">
    <h2>매도 기록</h2>
    <div class="field">
      <label>날짜</label>
      ${dateSelectHtml('sell', today)}
    </div>
    <div class="field"><label>체결단가</label><input type="number" id="sellPrice" placeholder="$" inputmode="decimal" value="${dP}" oninput="updateSellPreview(${avgPrice})"></div>
    <div class="field"><label>수량</label><input type="number" id="sellQty" placeholder="주" inputmode="numeric" step="1" value="${dQ}" oninput="updateSellPreview(${avgPrice})"></div>
    <div class="field"><label>매도 수수료</label><input type="number" id="sellFee" placeholder="$0" inputmode="decimal" value="${dF}" oninput="updateSellPreview(${avgPrice})"></div>
    <div class="settlebox"><span class="l">매도 정산금액</span><span class="v mono" id="sellSettle">$0.00</span></div>
    <div class="settlebox"><span class="l">예상 실현손익 (현재 평단 $${fmt(avgPrice)} 대비)</span><span class="v mono" id="sellPnl">$0.00</span></div>
    ${(S.setup.mode==='v4') ? `<div class="field"><label>종류</label>
      <div class="seg" id="segSellKind">

        <button data-v="limit" class="${addDraft.sellKind==='limit'?'active':''}" onclick="pickSeg('segSellKind',this)">지정가매도(3/4)</button>

function updateBuyPreview(){
  const price = Number(document.getElementById('buyPrice').value)||0;

  const fee = Number(document.getElementById('buyFee').value)||0;
  document.getElementById('buySettle').textContent = '$'+fmt(price*qty+fee);
}
function updateSellPreview(avgPrice){
  const price = Number(document.getElementById('sellPrice').value)||0;
  const qty = Number(document.getElementById('sellQty').value)||0;
  const fee = Number(document.getElementById('sellFee').value)||0;
  document.getElementById('sellSettle').textContent = '$'+fmt(price*qty-fee);
  const pnl = (price-avgPrice)*qty - fee;
  const el = document.getElementById('sellPnl');
  el.textContent = (pnl>=0?'+':'')+'$'+fmt(pnl);
  el.className = 'v mono '+(pnl>=0?'down':'up');
}
function submitBuy(){
  const date = getDateSelectValue('buy');
  const price = Number(document.getElementById('buyPrice').value);
  const qty = Math.round(Number(document.getElementById('buyQty').value));
  const fee = Number(document.getElementById('buyFee').value)||0;
  if(!price||!qty){ notify('가격과 수량을 입력해주세요'); return; }
  const flags = {};
  if(S.setup.mode==='v4'){ flags.postSellDrop = document.getElementById('buyFlagDrop').checked; }
  S.trades = [...S.trades, { id:uid(), ts:new Date(date).getTime()+Math.random(), type:'buy', price, qty, fee, flags }];
  resetAddDraft(); saveState(); currentTab='plan'; render();
}
function submitSell(){
  const date = getDateSelectValue('sell');
  const price = Number(document.getElementById('sellPrice').value);
  const qty = Math.round(Number(document.getElementById('sellQty').value));
  const fee = Number(document.getElementById('sellFee').value)||0;
  if(!price||!qty){ notify('가격과 수량을 입력해주세요'); return; }
  const flags = {};
  if(S.setup.mode==='v4'){
    flags.quarterSell = document.querySelector('#segSellKind .active').dataset.v === 'quarter';
  }
  S.trades = [...S.trades, { id:uid(), ts:new Date(date).getTime()+Math.random(), type:'sell', price, qty, fee, flags }];
  resetAddDraft(); saveState(); currentTab='plan'; render();
}

/* ---------- History ---------- */
function histView(e){
  if(S.trades.length===0){
    return `<div class="card"><h2>매매이력</h2><div class="empty">기록이 없습니다.</div></div>`;
  }
  const rows = S.trades.slice().sort((a,b)=>b.ts-a.ts).map(tr=>{
    const d = new Date(tr.ts).toISOString().slice(0,10);
    const kind = tr.type==='buy' ? '매수' : '매도';
    const flagTxt = tr.flags && tr.flags.postSellDrop ? ' · 지정가매도 후 하락매수' : (tr.flags && tr.flags.quarterSell!==undefined ? (tr.flags.quarterSell?' · 쿼터매도':' · 지정가매도') : '');
    let pnlTxt = '';
    if(tr.type==='sell'){
      const pnl = e && e.tradePnl ? e.tradePnl[tr.id] : undefined;
      if(pnl!==undefined){
        const pnlColor = pnl>=0 ? 'var(--up)' : 'var(--sell)'; // 수익실현=빨강, 손실실현=파랑
        pnlTxt = ` <span class="mono" style="font-weight:600; color:${pnlColor};">(${pnl>=0?'+':''}$${fmt(pnl)})</span>`;
      }
    }
    return `<div class="trade-item" data-trade-id="${tr.id}">
      <div>
        <div class="titleline" style="font-weight:600"><span class="tag ${tr.type}">${kind}</span> · $${fmt(tr.price)} × ${fmtInt(tr.qty)}주${pnlTxt}</div>
        <div class="metaline meta">${d}${flagTxt}</div>
      </div>
      <div style="display:flex; gap:4px; flex-shrink:0;">
        <button class="del" style="color:var(--accent);" onclick="openEditTrade('${tr.id}')">수정</button>
        <button class="del" onclick="handleDelClick('${tr.id}', this)">삭제</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><h2>매매이력 (${S.trades.length}건)</h2>${rows}</div>`;
}
function openEditTrade(id){
  const tr = S.trades.find(t=>t.id===id);
  if(!tr) return;
  const dateVal = new Date(tr.ts).toISOString().slice(0,10);
  const isBuy = tr.type==='buy';
  let flagsHtml = '';
  if(S.setup.mode==='v4' && isBuy){
    flagsHtml = `<div class="checkline"><input type="checkbox" id="editFlagDrop" ${tr.flags&&tr.flags.postSellDrop?'checked':''}><label for="editFlagDrop">지정가매도 직후 하락해서 발생한 매수</label></div>`;
  } else if(S.setup.mode==='v4' && !isBuy){
    flagsHtml = `<div class="field"><label>종류</label>
      <div class="seg" id="editSegSellKind">
        <button data-v="quarter" class="${(tr.flags&&tr.flags.quarterSell)?'active':''}" onclick="pickSeg('editSegSellKind',this)">쿼터매도(1/4)</button>
        <button data-v="limit" class="${(tr.flags&&!tr.flags.quarterSell)?'active':''}" onclick="pickSeg('editSegSellKind',this)">지정가매도(3/4)</button>
      </div></div>`;
  }
  showModal(`
    <h3>${isBuy?'매수':'매도'} 기록 수정</h3>
    <div class="field">
      <label>날짜</label>
      ${dateSelectHtml('edit', dateVal)}
    </div>
    <div class="field"><label>체결단가</label><input type="number" id="editPrice" value="${tr.price}" inputmode="decimal"></div>
    <div class="field"><label>수량</label><input type="number" id="editQty" value="${Math.round(tr.qty)}" inputmode="numeric" step="1"></div>
    <div class="field"><label>수수료</label><input type="number" id="editFee" value="${tr.fee||0}" inputmode="decimal"></div>
    ${flagsHtml}
    <button class="btn ${isBuy?'buy':'sell'}" onclick="saveEditTrade('${id}')">저장</button>
  `);
}
function saveEditTrade(id){
 try{
  const tr = S.trades.find(t=>t.id===id);
  if(!tr){ showBootError('수정 오류: 해당 기록을 찾을 수 없음 (id='+id+')'); return; }
  const date = getDateSelectValue('edit');
  const price = Number(document.getElementById('editPrice').value);
  const qty = Math.round(Number(document.getElementById('editQty').value));
  const fee = Number(document.getElementById('editFee').value)||0;
  if(!price||!qty){ notify('가격과 수량을 입력해주세요'); return; }
  if(!date){ notify('날짜를 선택해주세요'); return; }
  tr.price = price; tr.qty = qty; tr.fee = fee;
  const fracTie = tr.ts - Math.floor(tr.ts);
  tr.ts = new Date(date+'T00:00:00Z').getTime() + fracTie;
  if(S.setup.mode==='v4'){
    if(tr.type==='buy'){
      tr.flags = tr.flags || {};
      tr.flags.postSellDrop = document.getElementById('editFlagDrop').checked;
    } else {
      tr.flags = tr.flags || {};
      tr.flags.quarterSell = document.querySelector('#editSegSellKind .active').dataset.v === 'quarter';
    }
  }
  saveState();
  try{ sessionStorage.setItem('infbuy_toast_after_reload', '기록을 수정했습니다.'); }catch(e){}
  currentTab = 'hist';
  try{ sessionStorage.setItem('infbuy_tab_after_reload', 'hist'); }catch(e){}
  // force a genuine reload rather than trust an in-page patch/re-render: guarantees the
  // updated values actually show, regardless of anything else going on in this view.
  location.reload();
 }catch(err){
   console.error('saveEditTrade error', err);
   showBootError('수정 저장 오류: '+(err && err.message ? err.message : err));
 }
}

/* ---------- Settlement history ---------- */
function daysBetween(t1,t2){ return Math.max(1, Math.round((t2-t1)/86400000)); }
function dstr(ts){ const d=new Date(ts); return `${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}.${d.getDate()}`; }
function settleView(e){
  if(!e || !e.cycles || e.cycles.length===0){
    return `<div class="card"><h2>정산이력</h2><div class="empty">완료된(보유수량 0으로 종료된)<br>사이클이 아직 없습니다.</div></div>`;
  }
  const cycles = e.cycles.slice().reverse();
  const totalPnl = e.cycles.reduce((s,c)=>s+c.pnl,0);
  const totalFee = e.cycles.reduce((s,c)=>s+c.fee,0);
  const pnlClass = totalPnl>=0 ? 'down' : 'up';
  const cards = cycles.map(c=>{
    const netInvestedC = Math.max(c.buyAmt - c.sellAmt, 0);
    const seedUsedPct = c.seed>0 ? (netInvestedC/c.seed*100) : 0;
    const cPnlClass = c.pnl>=0 ? 'down':'up';
    const tCycle = c.base1Round>0 ? (netInvestedC/c.base1Round) : 0;
    const tStat = seedUsedPct<=100
      ? `<div class="stat"><div class="l">진행회차 (T)</div><div class="v mono">${fmt(tCycle,2)}T / ${c.divisions}</div></div>`
      : '';
    return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <div style="font-weight:700; font-size:16px;">${c.stock} <span style="font-size:11.5px; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:6px; margin-left:4px;">${modeLabel(c.mode)}</span></div>
          <div class="meta" style="margin-top:3px;">${dstr(c.startTs)} ~ ${dstr(c.endTs)}</div>
        </div>
        <div class="mono ${cPnlClass}" style="font-size:19px; font-weight:700;">${c.pnl>=0?'+':''}$${fmt(c.pnl)}</div>
      </div>
      <div class="divider"></div>
      <div class="grid2">
        <div class="stat"><div class="l">시드</div><div class="v mono">$${fmtInt(c.seed)}</div></div>
        <div class="stat"><div class="l">누적매수금</div><div class="v mono">$${fmt(c.buyAmt)}</div></div>
        <div class="stat"><div class="l">분할수</div><div class="v mono">${c.divisions}회</div></div>
        <div class="stat"><div class="l">누적매도금</div><div class="v mono">$${fmt(c.sellAmt)}</div></div>
        <div class="stat"><div class="l">1회 매수금</div><div class="v mono">$${fmtInt(c.base1Round)}</div></div>
        <div class="stat"><div class="l">매매수수료</div><div class="v mono">$${fmt(c.fee)}</div></div>
        <div class="stat"><div class="l">운용일수</div><div class="v mono">${daysBetween(c.startTs,c.endTs)}일</div></div>
        <div class="stat"><div class="l">매수/매도 횟수</div><div class="v mono">${c.buyCount}회 / ${c.sellCount}회</div></div>
        <div class="stat" style="grid-column:1 / span 2;"><div class="l">시드소진율 (순매수 기준)</div><div class="v mono">${fmt(seedUsedPct,2)}%</div></div>
        ${tStat}
      </div>
    </div>`;
  }).join('');
  return `
  <div class="card">
    <h2>총 정산손익</h2>
    <div class="mono ${pnlClass}" style="font-size:30px; font-weight:700;">${totalPnl>=0?'+':''}$${fmt(totalPnl)}</div>
    <div class="grid2" style="margin-top:14px;">
      <div class="stat"><div class="l">매매수수료 합</div><div class="v mono">$${fmt(totalFee)}</div></div>
      <div class="stat"><div class="l">정산 사이클 수</div><div class="v mono">${e.cycles.length}개</div></div>
    </div>
  </div>
  ${cards}`;
}

/* ---------- Modal ---------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
function notify(msg){
  showModal(`<h3>안내</h3><div style="color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:16px;">${msg}</div><button class="btn primary" onclick="closeModal()">확인</button>`);
}
let pendingConfirm = null;
function askConfirm(msg, action){
  pendingConfirm = action;
  showModal(`<h3>확인해주세요</h3><div style="color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:16px;">${msg}</div><div class="btnrow"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn sell" onclick="runPendingConfirm()">삭제</button></div>`);
}
function runPendingConfirm(){
  const fn = pendingConfirm; pendingConfirm = null;
  closeModal();
  if(fn){
    try{ fn(); }
    catch(err){
      console.error('confirm action error', err);
      notify('작업 중 오류가 발생했어요:<br><span class="mono" style="font-size:11px;">'+String(err && err.message || err)+'</span>');
    }
  }
}

/* ---------- init ---------- */
render();
initCloud();
checkUndoSnapshotAfterReload();
</script>
<script>
/* ---------- 키보드 열림 감지: 입력 중에는 탭바 숨기기 ---------- */
(function(){
  var hideTimer=null;
  function isField(el){
    if(!el) return false;
    var t=(el.tagName||'').toUpperCase();
    if(t==='TEXTAREA'||t==='SELECT') return true;
    if(t==='INPUT'){
      var ty=(el.type||'').toLowerCase();
      return ['button','submit','checkbox','radio','range','color','file','reset'].indexOf(ty)===-1;
    }
    return el.isContentEditable===true;
  }
  document.addEventListener('focusin', function(e){
    if(isField(e.target)){ clearTimeout(hideTimer); document.body.classList.add('kb-open'); }
  });
  document.addEventListener('focusout', function(){
    clearTimeout(hideTimer);
    // 다른 입력칸으로 옮겨가는 경우·키보드가 내려가는 동안 탭바가 갑자기 나타나 버튼을 가리지 않도록 잠시 기다림
    hideTimer=setTimeout(function(){
      if(!isField(document.activeElement)) document.body.classList.remove('kb-open');
    }, 300);
  });
})();
</script>
